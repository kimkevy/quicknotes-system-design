<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>QuickNotes</h1>
      <button id="load-btn" type="button">Load Notes</button>
    </header>

    <p id="status" role="status" aria-live="polite"></p>

    <section class="form-section">
      <form id="note-form">
        <div class="form-group">
          <label for="title-input">Title</label>
          <input type="text" id="title-input" name="title" required placeholder="Enter note title">
        </div>
        <div class="form-group">
          <label for="body-input">Body</label>
          <textarea id="body-input" name="body" rows="4" required placeholder="Write your note here..."></textarea>
        </div>
        <button type="submit" id="submit-btn">Save Note</button>
      </form>
    </section>

    <section class="notes-section">
      <h2>Your Notes</h2>
      <ul id="notes-list"></ul>
    </section>
  </div>
</body>
</html>
